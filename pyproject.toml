[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Agentic paper trading harness for Indian equity swing trading"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "yfinance>=0.2.40",
  "feedparser>=6.0.11",
  "langgraph>=0.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tradingbot*", "tradeloop*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tradeloop/tests"]
pythonpath = ["src"]
