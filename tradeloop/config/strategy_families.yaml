families:
  - id: 20d_breakout
    status: implemented
    description: 20-day high breakout, enter on first pullback to breakout level
    typical_horizon_days: [3, 10]
    requires: [volume_confirmation, ATR_stop]
    buy_conditions:
      - Close > max(Close[-21:-1])  # price breaks 20-day high
      - Optional: Volume > 1.5x 20-day average (adds 2 to score)
      - Regime: trend_up or pullback_in_uptrend preferred; avoid in choppy/risk_off
    sell_conditions:
      - STOP: price <= entry - 1.5*ATR  (hard stop, enforced automatically)
      - EXIT: daily close drops below the 20-day high that was broken (failed breakout)
      - TRIM 50%: first target hit (entry + 3*ATR = 2R)
      - EXIT remaining: second target hit (entry + 4.5*ATR = 3R)
      - EXIT: negative news that breaks the original catalyst thesis

  - id: ema20_pullback
    status: implemented
    description: Uptrend with price above EMA50 above EMA200, enter on pullback to EMA20
    typical_horizon_days: [5, 20]
    requires: [no_negative_news, sector_strength]
    buy_conditions:
      - EMA20 > EMA50 > EMA200  (uptrend stack intact)
      - Close within 1.5% of EMA20 (at the dynamic support)
      - EMA20 is rising (slope positive over last 3 bars)
      - No negative news catalyst on the ticker
    sell_conditions:
      - STOP: price <= entry - 1.5*ATR  (hard stop)
      - EXIT: daily close below EMA50 (uptrend stack broken)
      - EXIT: EMA20 turns flat or down for 3+ consecutive sessions
      - TIGHTEN_STOP to breakeven: first target hit (entry + 3*ATR = 2R)
      - EXIT remaining: second target hit (entry + 4.5*ATR = 3R)

  - id: post_earnings_drift
    status: implemented
    description: Long after a clean results gap-up; enter during the quiet consolidation 1-3 days after the gap
    typical_horizon_days: [5, 15]
    requires: [earnings_gap_unfilled, volume_spike_on_gap_day]
    buy_conditions:
      - Gap-up >= 3% in last 1-3 sessions with volume >= 2x 20-day average
      - Gap NOT yet filled: current close >= gap-day opening price
      - RSI < 70 (not overbought)
      - No negative revision or guidance cut in news
    sell_conditions:
      - STOP: gap fills (close < gap-day open) OR price <= entry - 1.5*ATR
      - EXIT: negative earnings revision, guidance cut, or analyst downgrade appears in news
      - TRIM 50%: first target hit (entry + 3*ATR) if holding 5+ days
      - EXIT remaining: second target hit (entry + 4.5*ATR) OR day 15 elapsed (drift complete)

  - id: results_momentum
    status: implemented
    description: Strong momentum on the actual results day; large gap with bullish close signals continued move
    typical_horizon_days: [1, 5]
    requires: [results_day_gap_5pct, volume_3x, bullish_close]
    buy_conditions:
      - Today's open >= prior close + 5%  (results-day gap)
      - Today's volume >= 3x 20-day average
      - Bullish close: today's close in upper 50% of day's high-low range
      - Entry next session at open, or same-day if mid-session scan
    sell_conditions:
      - STOP: price <= results-day low - ATR/2  (micro-stop; low is the anchor)
      - EXIT: close < lower 50% of results-day candle (momentum failed, gap filling)
      - TRIM at first target (entry + 3*ATR)
      - Hard EXIT: day 5 elapsed regardless of price (short-horizon momentum fades)

  - id: sector_rotation_leader
    status: implemented
    description: Highest-ranked setup in a sector where >= 40% of tracked names have a breakout/pullback signal
    typical_horizon_days: [10, 20]
    requires: [sector_breadth_40pct, name_at_highest_score_in_sector]
    buy_conditions:
      - Sector breadth >= 40%: at least 40% of the sector's tracked symbols have a setup score > 0
      - The chosen name has the highest cleanliness_score among sector peers
      - Name itself qualifies on 20d_breakout or ema20_pullback criteria
      - Regime: trend_up or pullback_in_uptrend; avoid in risk_off
    sell_conditions:
      - STOP: close < entry - 1.5*ATR  (hard stop)
      - EXIT: sector breadth drops below 30% (rotation ending, institutional money leaving)
      - EXIT: close below own EMA50 (leadership broken)
      - EXIT: name begins underperforming the sector average for 3+ consecutive sessions
      - TIGHTEN_STOP to breakeven: first target hit (entry + 3*ATR)
      - EXIT remaining: second target hit (entry + 4.5*ATR)
