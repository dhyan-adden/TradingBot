capital:
  paper_starting_inr: 100000
  per_trade_risk_pct: 1.5
  max_open_risk_pct: 4.0
  max_concurrent_positions: 4
  min_position_size_inr: 15000
  max_position_pct: 25
  max_sector_exposure_pct: 50  # raised from 40 on 2026-07-07: user-approved two-bank
                               # entry (HDFCBANK+SBIN ~49% of book); reverting re-arms at 40
  daily_drawdown_circuit_pct: 3
  max_total_deployed_pct: 90

modes:
  premarket:
    enabled: true
    full_pipeline: true
    new_entries_allowed: true
  intraday:
    enabled: true
    manage_only: true
    new_entries_allowed: false
  postclose:
    enabled: true
    learning_only: true
  adhoc:
    enabled: true
    full_pipeline: true
    user_request_required: true

universe:
  base_index: NIFTY500
  source: full_nse            # full_nse (pull all NSE equities from Kite) | config_yaml (hand-listed symbols)
  cache_days: 7               # how long the fetched instrument list is reused before refresh
  include_indices_as_context: [NIFTY50, BANKNIFTY, NIFTYIT, NIFTYAUTO, NIFTYPHARMA, NIFTYFMCG]
  min_avg_daily_turnover_cr: 5   # liquidity floor in Rs crore (5cr = 50,000,000 INR); 0 disables
  min_stop_distance_pct: 1.0     # reject setups whose ATR stop is tighter than this % (kills
                                 # near-zero-volatility junk e.g. cash ETFs); 0 disables
  exclude_segments: [SME, ETF_LEVERAGED]
  pace_seconds: 0.34          # delay between historical calls (~3 req/s Kite limit)
  max_symbols: 2500           # hard ceiling on symbols scanned
  max_setups_downstream: null  # null (or 0) = analyze the FULL tradeable scan; the
                               # aggregate shortlister is the selector over everything.
                               # Full scan still saved to disk. Set a number to re-cap
                               # (required if falling back to the OpenRouter backend,
                               # whose small models cannot take the full block).

shortlist:
  target_size: 12
  news_driven_share: 0.7
  technical_driven_share: 0.3

trading:
  segment: EQ
  allowed_products: [CNC, MIS]
  side: LONG_ONLY
  zerodha_enable_trading: false

costs:
  cnc_brokerage_inr: 0
  mis_brokerage_inr_max: 20
  mis_brokerage_pct: 0.0003
  stt_sell_cnc_pct: 0.001
  stt_sell_mis_pct: 0.00025
  stamp_buy_cnc_pct: 0.00015
  stamp_buy_mis_pct: 0.00003
  gst_pct: 0.18
  dp_charge_inr_per_scrip: 15.93
  slippage_bps:
    nifty50: 5
    next50: 10
    midcap150: 15
    other: 25

memory:
  lessons_dedupe_similarity: 0.8
  strategy_min_trades_for_trust: 10
  dossier_curation_cadence_days: 7

live_promotion_gates:
  min_paper_trades: 40
  min_win_rate: 0.45
  min_expectancy_r: 0.3
  max_drawdown_pct: 8

cycle_timeout_seconds: 1800  # 11 sequential claude -p stages (opus x4) over the full
                             # uncapped setup scan; ~40-120s/call, so 30min headroom.
