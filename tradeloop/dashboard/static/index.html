<!doctype html>
<meta charset="utf-8">
<title>TradeLoop</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  select, button { font: inherit; padding: 6px 10px; }
  .card { border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .card h3 { margin: 0 0 2px; font-size: 17px; }
  .cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .model { color: #555; font-size: 11px; background: #eef1f5; border-radius: 6px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .role { color: #666; font-size: 13px; margin: 0 0 8px; }
  .summary { font-weight: 600; margin: 0 0 6px; }
  ul { margin: 6px 0 0; padding-left: 20px; }
  .decision { border-color: #2b7; background: #f3fbf6; }
  .waiting { color: #999; font-style: italic; }
  #bar { display: flex; gap: 10px; align-items: center; }
  h2 { font-size: 18px; margin: 22px 0 8px; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { border: 1px solid #e2e2e2; border-radius: 10px; padding: 10px 14px; flex: 1 1 120px; }
  .tile .label { color: #666; font-size: 12px; }
  .tile .value { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 4px; font-size: 14px; }
  th { color: #666; font-weight: 600; text-align: left; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .gain { color: #1a7f4b; } .loss { color: #b3362c; }
  .pricenote { color: #888; font-size: 12px; }
  .side { font-size: 12px; border-radius: 6px; padding: 1px 7px; background: #eef1f5; }
  li.arg { list-style: none; margin: 3px 0 3px 10px; color: #444; }
  li.arg .side { font-size: 10px; font-weight: 650; }
  .statusgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .statusitem { border: 1px solid #e2e2e2; border-radius: 10px; padding: 10px 12px; }
  .statusitem .label { color: #666; font-size: 12px; }
  .statusitem .value { font-weight: 650; }
  .ok { color: #1a7f4b; } .warn { color: #9a6700; } .bad { color: #b3362c; }
  .usage { margin: 12px 0; }
  .usage-note { color: #666; font-size: 12px; margin: 4px 0 0; }
</style>
<h1>TradeLoop - what the bot is thinking</h1>
<div id="bar">
  <button id="runNow">Run now</button>
  <button id="routePaper">Route paper orders</button>
  <select id="picker"></select>
  <span id="status"></span>
</div>
<h2>Readiness</h2>
<div id="readiness" class="statusgrid"></div>
<h2>Portfolio</h2>
<div class="tiles" id="tiles"></div>
<div id="holdings"></div>
<h2>Transactions</h2>
<div id="transactions"></div>
<h2>Latest run</h2>
<div id="usage"></div>
<div id="cards"></div>
<script>
let current = null, timer = null;

async function loadRuns() {
  const r = await fetch('/api/runs').then(x => x.json());
  const picker = document.getElementById('picker');
  picker.innerHTML = '';
  for (const run of r.runs) {
    const o = document.createElement('option');
    o.value = run.dir_name;
    o.textContent = run.dir_name + '  -  ' + run.decision;
    picker.appendChild(o);
  }
  if (r.runs.length && !current) selectRun(r.runs[0].dir_name);
}

function selectRun(dir) {
  current = dir;
  document.getElementById('picker').value = dir;
  poll();
}

async function poll() {
  if (!current) return;
  const run = await fetch('/api/run?dir=' + encodeURIComponent(current)).then(x => x.json());
  render(run);
  clearTimeout(timer);
  if (run.live) {
    document.getElementById('status').textContent = 'live - running...';
    timer = setTimeout(poll, 1500);
  } else {
    document.getElementById('status').textContent = 'complete';
  }
}

document.getElementById('routePaper').onclick = async () => {
  if (!current || !confirm('Route the selected orders in PaperBroker? No live order will be sent.')) return;
  const result = await fetch('/api/route-paper?dir=' + encodeURIComponent(current)).then(x => x.json());
  document.getElementById('status').textContent = result.routed
    ? 'paper orders routed' : (result.output || result.error || 'paper route blocked');
  await poll();
};

function point(p) {
  if (p.startsWith('For: '))
    return '<li class="arg"><span class="side gain">FOR</span> ' + escapeHtml(p.slice(5)) + '</li>';
  if (p.startsWith('Against: '))
    return '<li class="arg"><span class="side loss">AGAINST</span> ' + escapeHtml(p.slice(9)) + '</li>';
  return '<li>' + escapeHtml(p) + '</li>';
}

function card(s, extraClass) {
  const points = (s.points || []).map(point).join('');
  const model = s.model ? '<span class="model">' + escapeHtml(s.model) + '</span>' : '';
  return '<div class="card ' + (extraClass || '') + '">'
    + '<div class="cardhead"><h3>' + escapeHtml(s.title) + '</h3>' + model + '</div>'
    + '<p class="role">' + escapeHtml(s.role || '') + '</p>'
    + (s.summary ? '<p class="summary">' + escapeHtml(s.summary) + '</p>' : '')
    + (points ? '<ul>' + points + '</ul>' : '')
    + '</div>';
}

function render(run) {
  renderUsage(run.usage || {});
  const html = (run.stages || []).map(s => card(s)).join('')
    + card(run.decision, 'decision');
  document.getElementById('cards').innerHTML = html;
}

function renderUsage(u) {
  const cost = u.cost_known ? '$' + Number(u.cost_usd || 0).toFixed(6) : 'not reported';
  const note = u.cost_known ? (u.cost_source === 'estimated_openrouter_pricing'
    ? 'Estimated from reported tokens and configured OpenRouter model rates.'
    : 'Provider-reported cost from the run audit log.')
    : 'No provider cost was reported for this run.';
  const rows = Object.entries(u.by_stage || {}).map(([stage, v]) =>
    '<tr><td>' + escapeHtml(stage) + '</td><td class="num">' + v.calls
    + '</td><td class="num">' + Number(v.total_tokens || 0).toLocaleString('en-IN')
    + '</td><td class="num">' + (u.cost_known ? '$' + Number(v.cost_usd || 0).toFixed(6) : '-') + '</td></tr>'
  ).join('');
  document.getElementById('usage').innerHTML = '<div class="card usage"><div class="cardhead">'
    + '<h3>LLM Usage</h3><span class="model">' + escapeHtml(cost) + '</span></div>'
     + '<p class="role">' + u.calls + ' provider call' + (u.calls === 1 ? '' : 's')
     + (u.by_stage && u.by_stage.codex_orchestrator && u.by_stage.codex_orchestrator.handoffs
       ? ' · ' + u.by_stage.codex_orchestrator.handoffs + ' expert handoffs' : '')
     + ' · ' + Number(u.total_tokens || 0).toLocaleString('en-IN')
    + ' total tokens · ' + u.successful_calls + ' successful · ' + u.failed_calls + ' failed</p>'
    + '<p class="usage-note">' + escapeHtml(note) + '</p>'
    + (rows ? '<table><tr><th>Stage</th><th class="num">Calls</th><th class="num">Tokens</th><th class="num">Cost</th></tr>' + rows + '</table>' : '')
    + '</div>';
}

function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const inr = n => n == null ? '-' : '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const pnl = (n, pct) => {
  if (n == null) return '-';
  const cls = n >= 0 ? 'gain' : 'loss', sign = n >= 0 ? '+' : '-';
  const tail = pct == null ? '' : ' (' + sign + Math.abs(pct).toFixed(2) + '%)';
  return '<span class="' + cls + '">' + sign + inr(Math.abs(n)) + tail + '</span>';
};
const pct = n => n == null ? '-'
  : '<span class="' + (n >= 0 ? 'gain' : 'loss') + '">' + (n >= 0 ? '+' : '-') + Math.abs(n).toFixed(2) + '%</span>';
const ist = ts => ts ? new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' IST' : '-';

function tile(label, value) {
  return '<div class="tile"><div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="value">' + value + '</div></div>';
}

function statusItem(label, value, cls) {
  return '<div class="statusitem"><div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="value ' + cls + '">' + escapeHtml(value) + '</div></div>';
}

async function loadStatus() {
  const s = await fetch('/api/status').then(x => x.json()).catch(() => null);
  if (!s) return;
  const promo = s.live_promotion || {};
  const sources = s.source_health || {};
  const latest = s.latest_run || {};
  document.getElementById('readiness').innerHTML =
    statusItem('Live env', s.live_trading_env_enabled ? 'enabled' : 'paper-only', s.live_trading_env_enabled ? 'warn' : 'ok')
    + statusItem('Live promotion', promo.ready ? 'ready' : 'blocked', promo.ready ? 'ok' : 'bad')
    + statusItem('Paper trades', String(promo.closed_paper_trades || 0), promo.ready ? 'ok' : 'warn')
    + statusItem('Audit gate', promo.clean_audits ? 'clean' : 'blocked', promo.clean_audits ? 'ok' : 'bad')
    + statusItem('Source health', sources.ok ? 'fresh' : 'stale: ' + (sources.stale_sources || []).join(', '), sources.ok ? 'ok' : 'bad')
    + statusItem('Kill switch', s.kill_switch_active ? 'active' : 'off', s.kill_switch_active ? 'bad' : 'ok')
    + statusItem('Latest approval', latest.approval || 'no run', latest.approval === 'approved' ? 'ok' : latest.approval ? 'warn' : 'warn')
    + statusItem('Live reconcile', latest.live_reconciliation || 'no run', latest.live_reconciliation === 'clean' ? 'ok' : 'warn');
}

async function loadPortfolio() {
  const p = await fetch('/api/portfolio').then(x => x.json()).catch(() => null);
  if (!p) return;
  document.getElementById('tiles').innerHTML =
    tile('Equity', inr(p.equity_inr))
    + tile('Cash', inr(p.cash_inr))
    + tile('Invested', inr(p.invested_inr))
    + tile('Unrealized P&L', pnl(p.unrealized_pnl_inr))
    + tile('Realized P&L', pnl(p.realized_pnl_inr))
    + tile('Return', pct(p.return_pct));
  const note = p.prices_live ? '' : '<p class="pricenote">Live prices unavailable (Zerodha session expired?) - showing book values at buy price.</p>';
  if (!p.holdings.length) {
    document.getElementById('holdings').innerHTML = '<p class="pricenote">No open positions.</p>';
  } else {
    document.getElementById('holdings').innerHTML = note
      + '<table><tr><th>Stock</th><th class="num">Qty</th><th class="num">Avg buy</th><th class="num">Now</th>'
      + '<th class="num">Value</th><th class="num">P&L</th><th class="num">Stop</th><th class="num">To stop</th></tr>'
      + p.holdings.map(h => '<tr><td>' + escapeHtml(h.symbol) + '</td>'
        + '<td class="num">' + h.quantity + '</td>'
        + '<td class="num">' + inr(h.avg_price) + '</td>'
        + '<td class="num">' + inr(h.ltp) + '</td>'
        + '<td class="num">' + inr(h.market_value_inr) + '</td>'
        + '<td class="num">' + pnl(h.unrealized_pnl_inr, h.unrealized_pct) + '</td>'
        + '<td class="num">' + inr(h.hard_stop) + '</td>'
        + '<td class="num">' + (h.stop_distance_pct == null ? '-' : h.stop_distance_pct.toFixed(2) + '%') + '</td></tr>').join('')
      + '</table>';
  }
  document.getElementById('transactions').innerHTML = !p.transactions.length
    ? '<p class="pricenote">No transactions yet.</p>'
    : '<table><tr><th>When</th><th>Side</th><th>Stock</th><th class="num">Qty</th>'
      + '<th class="num">Price</th><th class="num">Value</th><th class="num">Costs</th><th class="num">Realized P&L</th></tr>'
      + p.transactions.map(t => '<tr><td>' + ist(t.ts) + '</td>'
        + '<td><span class="side">' + escapeHtml(t.side) + '</span></td>'
        + '<td>' + escapeHtml(t.symbol) + '</td>'
        + '<td class="num">' + t.quantity + '</td>'
        + '<td class="num">' + inr(t.price) + '</td>'
        + '<td class="num">' + inr(t.value_inr) + '</td>'
        + '<td class="num">' + inr(t.costs_inr) + '</td>'
        + '<td class="num">' + pnl(t.realized_pnl_inr) + '</td></tr>').join('')
      + '</table>';
}

document.getElementById('picker').addEventListener('change', e => selectRun(e.target.value));
document.getElementById('runNow').addEventListener('click', async () => {
  document.getElementById('status').textContent = 'starting run...';
  const r = await fetch('/api/run-now', { method: 'POST' }).then(x => x.json()).catch(() => ({}));
  if (r.error) { document.getElementById('status').textContent = r.error; return; }
  setTimeout(async () => { await loadRuns(); await loadStatus(); const p = document.getElementById('picker'); if (p.value) selectRun(p.value); }, 2500);
});

loadRuns();
loadStatus();
loadPortfolio();
</script>
